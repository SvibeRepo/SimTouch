[package]
name = "sim-core"
version = "0.1.0"
edition = "2021"
description = "Allocation-free particle tick for the Svibe browser sim"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
